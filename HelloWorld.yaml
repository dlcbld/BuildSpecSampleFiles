  - type: Command
    timeoutInSeconds: 600
    name: "Unset pip proxy and fn build"
    command: |
      echo "pip proxy"
      pip3 config list
      pip3 config unset global.proxy
      # pip3 install Flask
      pip3 install -r requirements.txt --target func
      echo "fn version"
      fn version
      echo "fn ls contexts"
      fn ls contexts
      echo "fn create context"
      fn update context oracle.compartment-id ocid1.tenancy.oc1..aaaaaaaahzd35eshtcnfsa5to73bazwup5j6pcyswwiyikpxonk5ojfbmtaa
      fn create context abhishek-oci-context 
      echo "fn ls contexts"
      fn ls contexts
      echo "fn create app java-app"
      fn create app java-app
      fn list apps
      fn --verbose deploy --app java-app --local
      echo "fn create app java-app with annotation"
      fn create app java-app --annotation oracle.com/oci/subnetIds='["ocid1.subnet.oc1.iad.aaaaaaaarra7csuini5ybrwpsqpvmkbxtxlgtnpsg5w3vllel3e3htbkk56q"]'
      fn list apps
      fn --verbose deploy --app java-app --local
      

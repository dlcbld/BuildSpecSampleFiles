version: 0.1
component: build
timeoutInSeconds: 1200
shell: bash
env:
  variables:
    FUNCTION_VERSION: 0.0.1
  exportedVariables:
    - EXPORTED_FUNCTION_NAME
    - EXPORTED_APP_NAME
    - EXPORTED_VERSION
    - DOCKER_IMAGE_TAG

steps:
  - type: Command
    name: "Prepare variables"
    command: |
      # コンソールで設定したパイプラインパラメータをexportedVariablesへ設定
      export EXPORTED_FUNCTION_NAME=${FUNCTION_NAME}
      export EXPORTED_APP_NAME=${APP_NAME}
      export EXPORTED_VERSION=${VERSION}
  - type: Command  
    timeoutInSeconds: 600
    name: "change container engine type"
    command: |
      ls -lart  
      echo "hello world!"  
      cat ~/.fn/config.yaml  
      cat <<EOF >> ~/.fn/config.yaml  
      container-enginetype: podman  
      current-context: default  
      EOF  
      cat ~/.fn/config.yaml  
  - type: Command
    timeoutInSeconds: 600
    name: "Unset pip proxy and fn build"
    command: |
      echo "pip proxy"
      pip3 config list
      pip3 config unset global.proxy
      # pip3 install Flask
      pip3 install -r requirements.txt --target func
      echo "fn version"
      fn version
      curl -LSs https://raw.githubusercontent.com/fnproject/cli/master/install | sh
      echo "fn version after curl"
      fn version
      cho "fn create context"
      fn create context abhishek-oci-context --provider oracle
      fn use context abhishek-oci-context
      echo "fn ls contexts"
      fn ls contexts
      # fn create context my-local-ctx --api-url http://localhost:8080 --registry fnlocal
      # echo "fn ls contexts"
      # fn ls contexts
      # fn use context my-local-ctx
      # echo "fn ls contexts"
      # fn ls contexts
      # echo "fn init"
      # fn init --runtime java javafn
      # cd javafn
      # echo "cat func.yaml"
      # cat func.yaml
      # fn list contexts
      # fn create app java-app
      # fn --verbose deploy --app java-app --local
  - type: Command
    name: "Install Python Dependencies"
    timeoutInSeconds: 300
    command: |
      cd ${OCI_PRIMARY_SOURCE_DIR}/functions/${EXPORTED_FUNCTION_NAME}
      if [ -f requirements.txt ]; then
        if [ ! -d func ] || [ requirements.txt -nt func ]; then
          echo "Installing dependencies from requirements.txt"
          pip3 install --upgrade pip
          pip3 install -r requirements.txt --target func
        else
          echo "No change in requirements.txt. Skipping pip install."
        fi
      else
        echo "No requirements.txt found. Skipping dependency installation."
      fi

  - type: Command
    name: "Build OCI Function and Tag Docker Image"
    timeoutInSeconds: 600
    command: |
      echo "Starting function build"
      cd ${OCI_PRIMARY_SOURCE_DIR}/functions/${EXPORTED_FUNCTION_NAME}
      fn build --verbose
      export DOCKER_IMAGE_TAG=${EXPORTED_FUNCTION_NAME}:${EXPORTED_VERSION}
      docker tag ${EXPORTED_FUNCTION_NAME}:${FUNCTION_VERSION} ${DOCKER_IMAGE_TAG}

outputArtifacts:
  - name: function_build_output
    type: DOCKER_IMAGE
    location: ${DOCKER_IMAGE_TAG}

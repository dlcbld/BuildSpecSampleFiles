version: 0.1
component: build
timeoutInSeconds: 1200
shell: bash
env:
  variables:
    FUNCTION_VERSION: 0.0.1
  exportedVariables:
    - EXPORTED_FUNCTION_NAME
    - EXPORTED_APP_NAME
    - EXPORTED_VERSION
    - DOCKER_IMAGE_TAG

steps:
  - type: Command
    name: "Prepare variables"
    command: |
      # コンソールで設定したパイプラインパラメータをexportedVariablesへ設定
      export EXPORTED_FUNCTION_NAME=${FUNCTION_NAME}
      export EXPORTED_APP_NAME=${APP_NAME}
      export EXPORTED_VERSION=${VERSION}
  - type: Command
    timeoutInSeconds: 600
    name: "Unset pip proxy and install func"
    command: |
      echo "pip proxy"
      pip3 config list
      pip3 config unset global.proxy
      podman volume create --opt device=tmpfs --opt type=tmpfs --opt o=size=2M,nodev,noexec fniofsvol
      pip3 install -r requirements.txt --target func
      echo "fn version"
      fn version
  - type: Command  
    timeoutInSeconds: 600
    name: "change container engine type"
    command: |
      # ls -lart
      # cat ~/.fn/config.yaml  
      # cat <<EOF >> ~/.fn/config.yaml  
      # container-enginetype: podman  
      # current-context: default  
      # EOF  
      cat <<EOF > ~/.fn/config.yaml
      container-enginetype: podman
      current-context: default
      EOF
      cat ~/.fn/config.yaml  
  
  - type: Command  
    timeoutInSeconds: 600
    name: "fn deploy"
    command: |
      echo "fn ls contexts"
      fn ls contexts
      echo "fn create context"
      # fn update context oracle.compartment-id ocid1.tenancy.oc1..aaaaaaaahzd35eshtcnfsa5to73bazwup5j6pcyswwiyikpxonk5ojfbmtaa
      fn create context abhishek-oci-context
      fn use context abhishek-oci-context
      echo "fn ls contexts"
      fn ls contexts
      fn start --iofs-dir fniofsvol --data-dir fniofsvol
      # mkdir -p ~/.fn/iofs
      # mkdir -p ~/.fn/data
      # echo "fn start"
      # fn start --log-level DEBUG 
      # # --iofs-dir ~/.fn/iofs
      echo "fn create app java-app"
      fn create app java-app
      fn list apps
      fn --verbose deploy --app java-app --local

version: 0.1
component: build
timeoutInSeconds: 1200
shell: bash
env:
  variables:
    FUNCTION_VERSION: 0.0.1
  exportedVariables:
    - EXPORTED_FUNCTION_NAME
    - EXPORTED_APP_NAME
    - EXPORTED_VERSION
    - DOCKER_IMAGE_TAG

steps:
  - type: Command
    name: "Prepare variables"
    command: |
      # コンソールで設定したパイプラインパラメータをexportedVariablesへ設定
      export EXPORTED_FUNCTION_NAME=${FUNCTION_NAME}
      export EXPORTED_APP_NAME=${APP_NAME}
      export EXPORTED_VERSION=${VERSION}
  # - type: Command  
